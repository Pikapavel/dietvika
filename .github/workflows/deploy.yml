# Сборка и публикация на GitHub Pages при каждом push в main.
# Собранный сайт (dist) кладётся в ветку gh-pages; Pages настроен «Deploy from a branch: gh-pages / root».
# (Публикация через actions/deploy-pages зависла у GitHub 15.10.2026, поэтому используем ветку.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack app-source.json (one time)
        if: hashFiles('app-source.json') != ''
        run: |
          python3 - <<'EOF'
          import json, os
          j = json.load(open("app-source.json", encoding="utf-8"))
          for p, c in j.items():
              assert not os.path.isabs(p) and ".." not in p.split("/")
              d = os.path.dirname(p)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(p, "w", encoding="utf-8", newline="") as f:
                  f.write(c)
          EOF
          git rm -q app-source.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack app sources from app-source.json"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run icons
      - run: npm run build

      - name: Publish dist to gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
